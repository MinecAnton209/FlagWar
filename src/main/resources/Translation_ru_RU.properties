## War system
war.declared.broadcast=&e%s объявила войну %s. Боевые действия начнутся через %s.
war.started.broadcast=&eВойна началась между %s и %s!
war.truce.started=&7%s и %s заключили перемирие на %s.
war.truce.fatigue=&7Войска %s и %s истощены. Автоматическое перемирие вступило в силу.
war.truce.ended.broadcast=&eПеремирие между %s и %s закончилось. Боевые действия возобновляются!
war.betray.broadcast=&4%s нарушила перемирие с %s! Нация объявлена предателем.
war.negotiating.broadcast=&7%s и %s ведут мирные переговоры.
war.peace.signed=&aМир подписан между %s и %s.
war.diplomacy.notice=&7%s

## War commands
war.command.usage=&7Использование: /fw <declare|status|truce|peace|negotiate|treaty|betray|chat>
war.command.declare.usage=&7Использование: /fw declare <нация>
