war.command.truce.done=&aПеремирие предложено %s.
war.command.peace.usage=&7Использование: /fw peace <нация> | /fw peace accept <нация>
war.command.peace.negotiating=&7Переговоры с %s уже идут.
war.command.peace.proposed=&aМирные переговоры предложены %s.
war.command.peace.signed=&aМирный договор подписан. Начинается период нейтралитета.
war.command.peace.accepted-wait=&aВы приняли договор. Ожидание принятия от %s.
war.command.betray.done=&4Вы нарушили перемирие. Применены последствия предательства.
war.command.chat.joined=&7Вы вошли в дипломатический канал.
war.command.negotiate.usage=&7Использование: /fw negotiate abort <нация>
war.command.negotiate.aborted=&7Вы сорвали переговоры с %s. Война возобновляется.
war.command.treaty.usage=&7Использование: /fw treaty <нация> <plot|reparations|neutrality|whitepeace|submit|accept|reject>
