war.command.treaty.neutrality.usage=&7Использование: /fw treaty neutrality <дни>
war.command.treaty.neutrality.set=&aПериод нейтралитета установлен: %s дней.
war.command.treaty.whitepeace.set=&aЧерновик отмечен как белый мир: без условий.
