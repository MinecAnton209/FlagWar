war.command.treaty.plot.added=&aУчасток (%s, %s) добавлен в список возврата.
war.command.treaty.plot.removed=&aУчасток (%s, %s) убран из списка возврата.
war.command.treaty.reparations.usage=&7Использование: /fw treaty reparations <сумма>
