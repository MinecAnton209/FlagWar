## War system
war.declared.broadcast=&e%s has declared war on %s. Hostilities begin in %s.
war.started.broadcast=&eWar has begun between %s and %s!
war.truce.started=&7%s and %s are now at a truce for %s.
war.truce.fatigue=&7%s and %s are exhausted. An automatic truce is in effect.
war.truce.ended.broadcast=&eThe truce between %s and %s has ended. Hostilities resume!
war.betray.broadcast=&4%s has broken the truce with %s! They are now marked as traitors.
war.negotiating.broadcast=&7%s and %s are negotiating peace.
war.peace.signed=&aPeace has been signed between %s and %s.
war.diplomacy.notice=&7%s

## War commands
war.command.usage=&7Usage: /fw <declare|status|truce|peace|negotiate|treaty|betray|chat>
war.command.declare.usage=&7Usage: /fw declare <nation>
war.command.declare.done=&aWar declared against %s. Hostilities begin after the declaration delay.
war.command.truce.usage=&7Usage: /fw truce <nation>
war.command.truce.done=&aTruce proposed to %s.
war.command.peace.usage=&7Usage: /fw peace <nation> | /fw peace accept <nation>
war.command.peace.negotiating=&7Negotiations with %s are already underway.
war.command.peace.proposed=&aPeace negotiations proposed to %s.
war.command.peace.signed=&aPeace treaty signed. Neutrality period begins.
war.command.peace.accepted-wait=&aYou accepted the treaty. Waiting for %s to accept.
war.command.betray.done=&4You broke the truce. Betrayal consequences applied.
war.command.chat.joined=&7You joined the diplomacy channel.
war.command.chat.left=&7You left the diplomacy channel.
war.command.negotiate.usage=&7Usage: /fw negotiate abort <nation>
war.command.negotiate.aborted=&7You broke off negotiations with %s. The war resumes.
war.command.treaty.usage=&7Usage: /fw treaty <nation> <plot|reparations|neutrality|whitepeace|submit|accept|reject>
war.command.treaty.plot.usage=&7Usage: /fw treaty <nation> plot <add|remove> <x> <z>
war.command.treaty.plot.added=&aPlot (%s, %s) added to the return list.
war.command.treaty.plot.removed=&aPlot (%s, %s) removed from the return list.
war.command.treaty.reparations.usage=&7Usage: /fw treaty reparations <amount>
war.command.treaty.reparations.set=&aReparations set to %s.
war.command.treaty.neutrality.usage=&7Usage: /fw treaty neutrality <days>
war.command.treaty.neutrality.set=&aNeutrality period set to %s days.
war.command.treaty.whitepeace.set=&aDraft marked as a white peace: no conditions.
war.command.treaty.submitted=&aDraft submitted to the opposing delegation. Awaiting their response.
war.command.treaty.rejected=&7You rejected the submitted draft. Editing resumes.
war.negotiating.timedout=&eNegotiations have timed out. The war resumes.
war.negotiating.aborted=&4%s has broken off negotiations. The war resumes.
war.treaty.submitted=&7A peace draft has been submitted for your review. Use /fw treaty accept or reject.

