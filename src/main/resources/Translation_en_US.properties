war.status.truce=&7Truce with %s in effect. Remaining: %s.
war.status.negotiating=&7Negotiating peace with %s.
war.status.peacenow=&7At peace with %s.
war.status.cooldown=&7Post-peace cooldown with %s.
war.status.traitor=&4Your nation is marked as traitor! Declarations and truces are barred.

